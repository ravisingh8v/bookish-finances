    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #ffffff;
        color-scheme: light dark;
      }

      html.dark,
      html.dark body,
      html.dark #root {
        background: #0b1220;
      }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        min-height: 100vh;
        background: linear-gradient(180deg, #ffffff 0%, #e6fffb 100%);
        transition: opacity 350ms ease;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #app-splash.hide { opacity: 0; pointer-events: none; }
      #app-splash img {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        box-shadow: 0 10px 30px rgba(15, 118, 110, 0.25);
        animation: splash-pop 600ms ease both;
      }
      #app-splash .splash-title {
        font-size: 20px;
        font-weight: 700;
        color: #0f766e;
        letter-spacing: -0.01em;
      }
      #app-splash .splash-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #0f766e;
        opacity: 0.4;
        animation: splash-bounce 1s infinite ease-in-out;
      }
      #app-splash .splash-dots { display: flex; gap: 6px; }
      #app-splash .splash-dot:nth-child(2) { animation-delay: 0.15s; }
      #app-splash .splash-dot:nth-child(3) { animation-delay: 0.3s; }
      @keyframes splash-pop {
        0% { transform: scale(0.7); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes splash-bounce {
        0%, 100% { transform: translateY(0); opacity: 0.3; }
        50% { transform: translateY(-6px); opacity: 1; }
      }
      @media (prefers-color-scheme: dark) {
        #app-splash { background: linear-gradient(180deg, #0b1220 0%, #0f2a2a 100%); }
        #app-splash .splash-title { color: #5eead4; }
        #app-splash .splash-dot { background: #5eead4; }
      }
    </style>
  </head>

  <body>
    <div id="app-splash" role="status" aria-label="Loading Expense Tracker">
      <img src="/icon-192.png" alt="" width="96" height="96" />
      <div class="splash-title">Expense Tracker</div>
      <div class="splash-dots">
        <span class="splash-dot"></span>
        <span class="splash-dot"></span>
        <span class="splash-dot"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
